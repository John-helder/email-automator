<!DOCTYPE html>
<html>
<head>

  <title>Login - Automação de Emails</title>
  <link rel="stylesheet" href="style/styles.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <h1>Login</h1>

  <p>Não tem conta? <a href="register.html">Registrar</a></p>
</body>
</html>
