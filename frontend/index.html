<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Analyzer IA</title>
    <link rel="stylesheet" href="style/styles.css" />
</head>
<body>

  
    <header class="navbar">
        <div class="logo">📬 Email IA</div>
        <button id="toggleTheme">🌙</button>
    </header>

    <div class="layout">


        <aside class="sidebar">
            <h3>Caixa de Entrada</h3>
            <ul id="emailList"></ul>
        </aside>


        <main class="content">

            <div id="emailViewer" class="email-viewer hidden">
                <h2 id="emailSubject">Assunto</h2>
                <p id="emailBody">Clique em um e-mail para visualizar.</p>

                <button id="autoReplyBtn">Gerar Resposta Automática</button>

                <div id="loading" class="hidden loader"></div>

                <div id="generatedReply" class="reply-box hidden"></div>
            </div>

         
            <section class="history">
                <h3>Respostas Enviadas</h3>
                <ul id="replyHistory"></ul>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
