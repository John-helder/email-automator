<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - IA Email Analyzer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0077cc;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #userEmail {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    main {
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    textarea {
      padding: 0.5rem;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
    }

    input[type="file"] {
      font-size: 0.9rem;
    }

    button {
      padding: 0.7rem;
      background-color: #0077cc;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #005fa3;
    }

    section#resultados {
      margin-top: 2rem;
    }

    .card-resultado {
      background: #ffffff;
      padding: 1.2rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      line-height: 1.6;
      font-size: 1rem;
    }

    .card-resultado p {
      margin: 0.4rem 0;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #666;
    }

  </style>
</head>
<body>
  <header>
    <h1>Dashboard - IA Email Analyzer</h1>
    <div id="userEmail">Carregando usuário...</div>
    <button onclick="logout()">Logout</button>
  </header>

  <main>
    <form id="analyzeForm">
      <label for="textoEmail">Digite o conteúdo do email:</label>
      <textarea id="textoEmail" placeholder="Cole o texto do email aqui..."></textarea>

      <label for="fileEmail">Ou faça upload do arquivo (.txt ou .pdf):</label>
      <input type="file" id="fileEmail" accept=".txt,.pdf">

      <button type="submit">Analisar Email</button>
    </form>

    <section id="resultados">
      <h2>Resultados</h2>

      <div id="resultadoBonito" class="card-resultado">
        <p><strong>Usuário:</strong> <span id="resUsuario">-</span></p>
        <p><strong>Categoria:</strong> <span id="resCategoria">-</span></p>
        <p><strong>Resposta sugerida:</strong> <span id="resSugestao">-</span></p>
      </div>

    </section>
  </main>

  <footer>
    IA Email Analyzer &copy; 2025
  </footer>

  <script src="auth.js"></script>
  <script src="ia.js"></script>

  <script>
    const form = document.getElementById("analyzeForm");
    const textarea = document.getElementById("textoEmail");
    const fileInput = document.getElementById("fileEmail");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      let texto = textarea.value;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];

        if (file.type === "text/plain") {
          texto = await file.text();
        } else {
          alert("Somente arquivos .txt são aceitos no momento.");
          return;
        }
      }

      if (!texto.trim()) {
        alert("Insira o texto ou arquivo do email.");
        return;
      }

      const token = localStorage.getItem("token");

      const resp = await fetch("http://127.0.0.1:8000/api/ia/analisar-nlp", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ texto })
      });

      const data = await resp.json();

      document.getElementById("resUsuario").innerText = data.usuario || "-";
      document.getElementById("resCategoria").innerText = data.categoria || "-";
      document.getElementById("resSugestao").innerText = data.resposta_sugerida || "-";
    });
  </script>

</body>
</html>
